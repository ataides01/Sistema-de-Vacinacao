<div class="card">
  <div class="card-header">
    <h2>Relatórios Gerenciais</h2>
  </div>
  <div class="relatorios-grid">
    <div class="relatorio-card" (click)="gerarRelatorio('movimentacao')">
      <span class="material-icons">sync_alt</span>
      <h3>Movimentações</h3>
      <p>Relatório de entradas e saídas dos últimos 30 dias</p>
    </div>

    <div class="relatorio-card" (click)="gerarRelatorio('estoque')">
      <span class="material-icons">inventory_2</span>
      <h3>Estoque Atual</h3>
      <p>Relatório completo do estoque de vacinas</p>
    </div>

    <div class="relatorio-card" (click)="gerarRelatorio('solicitacoes')">
      <span class="material-icons">assignment</span>
      <h3>Solicitações</h3>
      <p>Relatório de solicitações dos últimos 30 dias</p>
    </div>
  </div>
</div>
