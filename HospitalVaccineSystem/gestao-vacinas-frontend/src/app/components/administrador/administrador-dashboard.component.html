<div class="dashboard">
  <div class="page-header">
    <h1>Dashboard - Administrador</h1>
  </div>

  <div class="cards-grid">
    <div class="card stat-card">
      <div class="stat-icon blue">
        <span class="material-icons">people</span>
      </div>
      <div class="stat-content">
        <div class="stat-label">Funcionários Ativos</div>
        <div class="stat-value">{{ totalUsuarios }}</div>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-icon green">
        <span class="material-icons">vaccines</span>
      </div>
      <div class="stat-content">
        <div class="stat-label">Total de Doses</div>
        <div class="stat-value">{{ totalEstoque }}</div>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-icon purple">
        <span class="material-icons">inventory</span>
      </div>
      <div class="stat-content">
        <div class="stat-label">Vacinas em Estoque</div>
        <div class="stat-value">{{ estoque.length }}</div>
      </div>
    </div>
  </div>
</div>
