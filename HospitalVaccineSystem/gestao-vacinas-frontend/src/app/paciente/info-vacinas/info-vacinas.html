<div class="feature-content">
  <h3>Informações Confiáveis (Tire Dúvidas)</h3>
  <p>Combatendo a desinformação com fatos validados.</p>

  <mat-accordion class="faq-container" multi="true">

    <mat-expansion-panel *ngFor="let item of mockPerguntas">
      
      <mat-expansion-panel-header>
        <mat-panel-title>
          <strong>{{ item.pergunta }}</strong>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <p>{{ item.resposta }}</p>

    </mat-expansion-panel>

  </mat-accordion>
</div>
